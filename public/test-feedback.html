<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Test Feedback GhostSeller</title>
<style>
body{font-family:Arial;background:#050812;color:white;padding:30px}
textarea,input,button{display:block;width:100%;max-width:600px;margin:10px 0;padding:12px;border-radius:10px}
button{background:#24d6ff;font-weight:bold}
pre{background:#111b3d;padding:14px;border-radius:10px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Test Feedback</h1>
<input id="email" placeholder="email">
<textarea id="message" placeholder="message">test</textarea>
<button onclick="send()">Envoyer test</button>
<pre id="out"></pre>
<script>
async function send(){
  const out=document.getElementById("out");
  out.textContent="Envoi...";
  const res=await fetch("/api/feedback",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      name:"Test",
      email:document.getElementById("email").value,
      rating:"Test",
      message:document.getElementById("message").value,
      page:"test-feedback"
    })
  });
  out.textContent=await res.text();
}
</script>
</body>
</html>
