<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Réinitialiser mot de passe • GhostSeller AI</title><link rel="icon" href="/favicon.ico" sizes="any"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#0e7490,#020617 60%);color:white;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:520px;max-width:95vw;background:#0f172a;border:1px solid #334155;border-radius:28px;padding:34px;box-shadow:0 30px 100px rgba(0,0,0,.35)}.badge{display:inline-block;background:#0e7490;color:#cffafe;padding:9px 15px;border-radius:999px;font-weight:900}h1{font-size:38px;margin:20px 0}p{color:#cbd5e1;line-height:1.5}input{width:100%;padding:16px;border:0;border-radius:14px;background:#1e293b;color:white;font-size:16px;margin:12px 0}button{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,#06b6d4,#3b82f6);color:white;font-weight:900;padding:16px;cursor:pointer;margin-top:12px}a{color:#93c5fd;text-decoration:none}#out{margin-top:16px;font-weight:900}
</style></head><body><div class="card"><div class="badge">GhostSeller AI</div><h1>Nouveau mot de passe</h1><p>Entre ton nouveau mot de passe. Il doit contenir au moins 8 caractères.</p><input id="password" type="password" placeholder="Nouveau mot de passe"><input id="confirm" type="password" placeholder="Confirmer le mot de passe"><button onclick="updatePassword()" id="btn">Mettre à jour</button><div id="out"></div><p><a href="/">Retour à la connexion</a></p></div>
<script>
function getHashParams(){const hash=window.location.hash.replace(/^#/,"");const params=new URLSearchParams(hash);return{access_token:params.get("access_token"),refresh_token:params.get("refresh_token"),type:params.get("type")}}
async function updatePassword(){
 const out=document.getElementById("out"),btn=document.getElementById("btn"),password=document.getElementById("password").value,confirm=document.getElementById("confirm").value,tokens=getHashParams();
 if(!tokens.access_token||!tokens.refresh_token){out.style.color="#ef4444";out.textContent="Lien invalide ou expiré. Recommence depuis mot de passe oublié.";return}
 if(password.length<8){out.style.color="#ef4444";out.textContent="Mot de passe trop court.";return}
 if(password!==confirm){out.style.color="#ef4444";out.textContent="Les mots de passe ne correspondent pas.";return}
 btn.disabled=true;btn.textContent="Mise à jour...";
 try{
  const res=await fetch("/api/auth/update-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({access_token:tokens.access_token,refresh_token:tokens.refresh_token,password})});
  const data=await res.json();
  if(data.ok){out.style.color="#22c55e";out.textContent="Mot de passe mis à jour. Redirection...";setTimeout(()=>window.location.href="/",1500)}
  else{out.style.color="#ef4444";out.textContent=data.error||"Erreur."}
 }catch(e){out.style.color="#ef4444";out.textContent="Erreur réseau."}
 finally{btn.disabled=false;btn.textContent="Mettre à jour"}
}
</script></body></html>
