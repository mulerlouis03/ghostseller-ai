<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GhostSeller AI V40</title>
<style>
body{background:#020617;color:white;font-family:Arial;padding:40px}
.card{background:#0f172a;padding:30px;border-radius:20px;max-width:900px;margin:auto}
input,select{width:100%;padding:14px;margin:10px 0;background:#1e293b;border:none;border-radius:12px;color:white}
button{padding:14px 20px;background:#0ea5e9;border:none;border-radius:12px;color:white;font-weight:700;cursor:pointer}
pre{background:#020617;padding:20px;border-radius:12px;overflow:auto}
</style>
</head>
<body>
<div class="card">
<h1>🧠 GhostSeller AI V40</h1>
<p>AI Content Engine</p>

<input id="niche" placeholder="Ex: Recharge Haiti">
<select id="platform">
<option>TikTok</option>
<option>Instagram</option>
<option>WhatsApp</option>
</select>

<select id="tone">
<option>viral</option>
<option>professional</option>
<option>luxury</option>
</select>

<button onclick="generate()">Générer</button>

<pre id="result"></pre>
</div>

<script>
async function generate(){
 const niche=document.getElementById('niche').value;
 const platform=document.getElementById('platform').value;
 const tone=document.getElementById('tone').value;

 document.getElementById('result').textContent=
`HOOKS:
- Cette stratégie change tout 🚀
- 3 erreurs qui détruisent vos ventes

CAPTIONS:
- GhostSeller AI transforme TikTok en clients.

HASHTAGS:
#AI #Business #GhostSeller

SCRIPT:
Hook → problème → solution → CTA

NICHE: ${niche}
PLATFORM: ${platform}
TONE: ${tone}`;
}
</script>
</body>
</html>
