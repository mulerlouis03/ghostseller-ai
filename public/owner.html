<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GhostSeller AI Owner Console</title>
<link rel="stylesheet" href="/owner.css">
<link rel="stylesheet" href="/global-auth-fix.css">
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><div class="logo">G</div><div><b>GhostSeller AI</b><span>Owner Console</span></div></div>
    <button onclick="tab('overview')" class="nav active">📊 Vue générale</button>
    <button onclick="tab('users')" class="nav">👥 Utilisateurs</button>
    <button onclick="tab('billing')" class="nav">💳 Abonnements</button>
    <button onclick="tab('feedback')" class="nav">💬 Retours</button>
    <button onclick="location.href='/'" class="nav">🏠 Espace utilisateur</button>
    <button onclick="logout()" class="logout">⎋ Déconnexion</button>
  </aside>
  <main>
    <div class="top"><div><h1>Owner Console</h1><p>Ton espace propriétaire stable.</p></div><button onclick="loadOwner()" class="cta">Rafraîchir</button></div>
    <section id="overview" class="tab">
      <div class="cards">
        <div class="card"><b id="totalUsers">0</b><span>Utilisateurs</span></div>
        <div class="card"><b id="activeSubs">0</b><span>Abonnements actifs</span></div>
        <div class="card"><b id="feedbackCount">0</b><span>Retours</span></div>
        <div class="card"><b>Online</b><span>Plateforme</span></div>
      </div>
    </section>
    <section id="users" class="tab hidden"><h2>Utilisateurs inscrits</h2><div id="usersTable" class="table"></div></section>
    <section id="billing" class="tab hidden"><h2>Abonnements</h2><div id="billingTable" class="table"></div></section>
    <section id="feedback" class="tab hidden"><h2>Retours utilisateurs</h2><div id="feedbackTable" class="table"></div></section>
    <section class="card"><h2>Diagnostic</h2><pre id="out">Chargement...</pre></section>
  </main>
</div>
<script src="/owner.js"></script>
<script src="/global-auth-fix.js"></script>
</body>
</html>
