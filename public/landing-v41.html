<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GhostSeller AI V41</title>
<style>
body{
background:#020617;
color:white;
font-family:Arial;
padding:40px;
}
.box{
max-width:800px;
margin:auto;
background:#08142f;
padding:40px;
border-radius:30px;
}
input{
width:100%;
padding:16px;
margin:12px 0;
border:none;
border-radius:14px;
background:#0f172a;
color:white;
}
button{
width:100%;
padding:18px;
border:none;
border-radius:14px;
background:#0ea5e9;
color:white;
font-weight:700;
cursor:pointer;
}
.badge{
display:inline-block;
padding:10px 18px;
background:#0ea5e9;
border-radius:999px;
margin-bottom:20px;
}
</style>
</head>
<body>

<div class="box">
<span class="badge">🚀 GhostSeller AI</span>

<h1>Rejoindre la Waitlist</h1>

<p>Accès anticipé aux futures fonctions IA marketing.</p>

<input id="name" placeholder="Nom">
<input id="business" placeholder="Business">
<input id="email" placeholder="Email">

<button onclick="joinWaitlist()">Rejoindre</button>

<div id="result"></div>
</div>

<script>
async function joinWaitlist(){
 document.getElementById("result").innerHTML=
 "<p style='color:#22c55e'>Inscription enregistrée 🚀</p>";
}
</script>

</body>
</html>
